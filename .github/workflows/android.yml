# Compila el APK de Celestia (Android) en GitHub. Resultado: un enlace fijo de descarga.
# Se ejecuta solo al subir cambios a index.html, o a mano desde Actions > "APK de Android" > Run workflow.
name: APK de Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'manifest.json'

permissions:
  contents: write

concurrency:
  group: apk-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUN_NUMBER: ${{ github.run_number }}
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Comprobar la llave de firma
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::Falta el secreto ANDROID_KEYSTORE_BASE64 (Settings > Secrets and variables > Actions > New repository secret)."
            exit 1
          fi

      - name: Instalar Node y Java
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar la app web
        run: |
          mkdir -p cap/www
          cp index.html manifest.json launchericon-192x192.png launchericon-512x512.png cap/www/
          cat > cap/package.json <<'EOF_PKG'
          {"name":"celestia-android","version":"1.0.0","private":true}
          EOF_PKG
          cat > cap/capacitor.config.json <<'EOF_CFG'
          {
            "appId": "app.celestia.player",
            "appName": "Celestia",
            "webDir": "www",
            "backgroundColor": "#0A0909",
            "android": { "adjustMarginsForEdgeToEdge": "disable" },
            "plugins": { "SystemBars": { "insetsHandling": "disable" } }
          }
          EOF_CFG

      - name: Instalar Capacitor y los plugins
        working-directory: cap
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps \
            @capacitor/core@8 @capacitor/android@8 @capacitor/app@8 @capacitor/browser@8 \
            @capacitor/filesystem@8 @capacitor/share@8 @capacitor/local-notifications@8 \
            @capgo/capacitor-media-session@8
          npm install --no-audit --no-fund --legacy-peer-deps --save-dev @capacitor/cli@8
          npx cap --version

      - name: Crear el proyecto Android
        working-directory: cap
        run: npx cap add android

      - name: Escribir los archivos propios (batería, actividad)
        run: |
          mkdir -p cap/extra
          cat > cap/extra/MainActivity.java <<'EOF_MAIN'
          package __PACKAGE__;

          import android.os.Bundle;
          import android.view.Window;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(PowerPlugin.class);
                  super.onCreate(savedInstanceState);
                  // En Android sin pantalla completa (muchos Samsung) las barras del sistema salían grises con iconos oscuros: se pintan como la app.
                  try {
                      Window w = getWindow();
                      w.setStatusBarColor(0xFF0A0909);
                      w.setNavigationBarColor(0xFF0A0909);
                      WindowInsetsControllerCompat c = WindowCompat.getInsetsController(w, w.getDecorView());
                      if (c != null) { c.setAppearanceLightStatusBars(false); c.setAppearanceLightNavigationBars(false); }
                  } catch (Exception ignored) { }
              }
          }
          EOF_MAIN
          cat > cap/extra/PowerPlugin.java <<'EOF_POWER'
          package __PACKAGE__;

          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.view.View;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowInsetsCompat;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          /* Ahorro de batería: dice si Android deja a Celestia sin restricciones y abre el permiso para activarlo. */
          @CapacitorPlugin(name = "CelestiaPower")
          public class PowerPlugin extends Plugin {

              @PluginMethod
              public void status(PluginCall call) {
                  boolean ignoring = true;
                  if (Build.VERSION.SDK_INT >= 23) {
                      PowerManager pm = (PowerManager) getContext().getSystemService(Context.POWER_SERVICE);
                      ignoring = pm != null && pm.isIgnoringBatteryOptimizations(getContext().getPackageName());
                  }
                  JSObject r = new JSObject();
                  r.put("ignoring", ignoring);
                  call.resolve(r);
              }

              /* Alto de la barra de estado y de la barra de gestos, en píxeles CSS, para que la app no quede tapada. */
              @PluginMethod
              public void insets(final PluginCall call) {
                  getActivity().runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              View v = getActivity().getWindow().getDecorView();
                              WindowInsetsCompat w = ViewCompat.getRootWindowInsets(v);
                              float d = getContext().getResources().getDisplayMetrics().density;
                              JSObject r = new JSObject();
                              int top = 0, bottom = 0, left = 0, right = 0;
                              if (w != null) {
                                  Insets i = w.getInsets(WindowInsetsCompat.Type.systemBars() | WindowInsetsCompat.Type.displayCutout());
                                  top = i.top; bottom = i.bottom; left = i.left; right = i.right;
                              }
                              // Si el sistema ya deja la app debajo de la barra de estado / de navegación (Android sin pantalla completa,
                              // como muchos Samsung), esos márgenes ya están "gastados": solo se cuenta lo que la app realmente tapa.
                              try {
                                  View wv = getBridge().getWebView();
                                  if (wv == null) wv = getActivity().findViewById(android.R.id.content);
                                  if (wv != null && v.getWidth() > 0 && v.getHeight() > 0) {
                                      int[] loc = new int[2];
                                      wv.getLocationInWindow(loc);
                                      int topGap = Math.max(0, loc[1]);
                                      int bottomGap = Math.max(0, v.getHeight() - (loc[1] + wv.getHeight()));
                                      int leftGap = Math.max(0, loc[0]);
                                      int rightGap = Math.max(0, v.getWidth() - (loc[0] + wv.getWidth()));
                                      top = Math.max(0, top - topGap);
                                      bottom = Math.max(0, bottom - bottomGap);
                                      left = Math.max(0, left - leftGap);
                                      right = Math.max(0, right - rightGap);
                                  }
                              } catch (Exception ignored) { }
                              r.put("top", Math.round(top / d));
                              r.put("bottom", Math.round(bottom / d));
                              r.put("left", Math.round(left / d));
                              r.put("right", Math.round(right / d));
                              call.resolve(r);
                          } catch (Exception e) {
                              call.reject("insets");
                          }
                      }
                  });
              }

              @PluginMethod
              public void request(PluginCall call) {
                  try {
                      Intent i = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                      i.setData(Uri.parse("package:" + getContext().getPackageName()));
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(i);
                      call.resolve();
                  } catch (Exception e) {
                      try {
                          Intent i2 = new Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS);
                          i2.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          getContext().startActivity(i2);
                          call.resolve();
                      } catch (Exception e2) {
                          call.reject("No disponible en este teléfono");
                      }
                  }
              }
          }
          EOF_POWER
          cat > cap/extra/customize.py <<'EOF_PY'
          # Personaliza el proyecto Android que genera Capacitor: permisos, iconos, colores, versión y el plugin de batería.
          import os, re, sys, glob
          from PIL import Image, ImageDraw

          ROOT = sys.argv[1] if len(sys.argv) > 1 else 'cap'
          APP_ID = 'app.celestia.player'
          VERSION_CODE = os.environ.get('RUN_NUMBER', '1')
          VERSION_NAME = '1.0.' + VERSION_CODE
          SRC_ICON = os.path.join(ROOT, 'www', 'launchericon-512x512.png')
          ANDROID = os.path.join(ROOT, 'android')
          MAIN = os.path.join(ANDROID, 'app', 'src', 'main')
          RES = os.path.join(MAIN, 'res')
          BG = '#2C2C2C'
          APPBG = '#0A0909'
          warns = []

          def warn(m):
              warns.append(m); print('AVISO:', m)

          def read(p):
              with open(p, encoding='utf-8') as f: return f.read()

          def write(p, t):
              os.makedirs(os.path.dirname(p), exist_ok=True)
              with open(p, 'w', encoding='utf-8') as f: f.write(t)

          # 1) Permisos en el manifiesto (obligatorio)
          man = os.path.join(MAIN, 'AndroidManifest.xml')
          t = read(man)
          perms = ['android.permission.INTERNET', 'android.permission.FOREGROUND_SERVICE', 'android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK',
                   'android.permission.WAKE_LOCK', 'android.permission.POST_NOTIFICATIONS', 'android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS']
          add = ''.join('    <uses-permission android:name="%s" />\n' % p for p in perms if p not in t)
          if '<application' not in t: sys.exit('ERROR: el manifiesto no tiene <application>')
          t = t.replace('<application', add + '    <application', 1) if add else t
          write(man, t)
          print('Permisos añadidos:', add.count('uses-permission'))

          # 2) Actividad principal y plugin de batería (obligatorio)
          pkg_dir = None
          for p in glob.glob(os.path.join(MAIN, 'java', '**', 'MainActivity.*'), recursive=True):
              pkg_dir = os.path.dirname(p); os.remove(p)
          if not pkg_dir:
              pkg_dir = os.path.join(MAIN, 'java', *APP_ID.split('.'))
          here = os.path.dirname(os.path.abspath(__file__))
          for name in ('MainActivity.java', 'PowerPlugin.java'):
              write(os.path.join(pkg_dir, name), read(os.path.join(here, name)).replace('__PACKAGE__', APP_ID))
          print('Java escrito en', pkg_dir)

          # 3) Versión (para poder actualizar encima de la anterior)
          for g in glob.glob(os.path.join(ANDROID, 'app', 'build.gradle*')):
              s = read(g)
              s2 = re.sub(r'versionCode\s*=?\s*\d+', 'versionCode ' + VERSION_CODE, s)
              s2 = re.sub(r'versionName\s*=?\s*"[^"]*"', 'versionName "%s"' % VERSION_NAME, s2)
              if s2 == s: warn('no se pudo cambiar la versión en ' + g)
              write(g, s2)

          # 4) Iconos
          def ico_bg():
              return Image.open(SRC_ICON).convert('RGB')
          try:
              base = ico_bg()
              for old in glob.glob(os.path.join(RES, 'mipmap-*', 'ic_launcher*')):   # evita recursos duplicados (png/webp/xml de la plantilla)
                  os.remove(old)
              dens = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
              for d, px in dens.items():
                  folder = os.path.join(RES, 'mipmap-' + d)
                  os.makedirs(folder, exist_ok=True)
                  sq = base.resize((px, px), Image.LANCZOS); sq.save(os.path.join(folder, 'ic_launcher.png'))
                  m = Image.new('L', (px * 4, px * 4), 0); ImageDraw.Draw(m).ellipse((0, 0, px * 4 - 1, px * 4 - 1), fill=255)
                  m = m.resize((px, px), Image.LANCZOS); rd = sq.convert('RGBA'); rd.putalpha(m); rd.save(os.path.join(folder, 'ic_launcher_round.png'))
                  fg_px = int(round(px * 108 / 48)); inner = int(fg_px * 0.66)
                  fg = Image.new('RGBA', (fg_px, fg_px), (0, 0, 0, 0))
                  fg.paste(base.resize((inner, inner), Image.LANCZOS).convert('RGBA'), ((fg_px - inner) // 2, (fg_px - inner) // 2))
                  fg.save(os.path.join(folder, 'ic_launcher_fg.png'))
              adaptive = '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/celestia_icon_bg"/>\n    <foreground android:drawable="@mipmap/ic_launcher_fg"/>\n</adaptive-icon>\n'
              write(os.path.join(RES, 'mipmap-anydpi-v26', 'ic_launcher.xml'), adaptive)
              write(os.path.join(RES, 'mipmap-anydpi-v26', 'ic_launcher_round.xml'), adaptive)
              write(os.path.join(RES, 'values', 'celestia_colors.xml'), '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="celestia_icon_bg">%s</color>\n</resources>\n' % BG)
              print('Iconos generados')
          except Exception as e:
              warn('iconos: %s' % e)

          # 4b) Icono pequeño de las notificaciones (silueta de luna, de un solo color: así lo exige Android)
          try:
              moon = '<?xml version="1.0" encoding="utf-8"?>\n<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">\n    <path android:fillColor="#FFFFFFFF" android:pathData="M12.6,3.1a9,9 0 1,0 8.3,12.2 7.2,7.2 0 0,1 -8.3,-12.2z"/>\n</vector>\n'
              for nm in ('ic_stat_celestia', 'media3_notification_small_icon', 'ic_notification', 'ic_stat_notification'):
                  write(os.path.join(RES, 'drawable', nm + '.xml'), moon)
              print('Icono de notificacion generado')
              for p in glob.glob(os.path.join(ROOT, 'node_modules', '@capgo', 'capacitor-media-session', 'android', '**', '*.*'), recursive=True):
                  if p.endswith(('.java', '.kt')):
                      for i, ln in enumerate(read(p).split('\n')):
                          if 'SmallIcon' in ln or 'small_icon' in ln: print('DIAG icono:', os.path.basename(p), i + 1, ln.strip())
          except Exception as e:
              warn('icono notificacion: %s' % e)

          # 5) Colores de la barra del sistema
          try:
              cp = os.path.join(RES, 'values', 'colors.xml')
              if os.path.exists(cp):
                  s = read(cp)
                  for n in ('colorPrimary', 'colorPrimaryDark'):
                      s = re.sub(r'(<color name="%s">)[^<]*(</color>)' % n, r'\g<1>%s\g<2>' % APPBG, s)
                  write(cp, s)
              else: warn('no hay colors.xml')
          except Exception as e:
              warn('colores: %s' % e)

          # 6) Pantalla de inicio oscura con el icono (reemplaza la imagen de ejemplo de Capacitor)
          try:
              n = 0
              for p in glob.glob(os.path.join(RES, 'drawable*', 'splash*.png')):
                  w, h = Image.open(p).size
                  im = Image.new('RGB', (w, h), APPBG)
                  s = int(min(w, h) * 0.30)
                  ic = base.resize((s, s), Image.LANCZOS)
                  im.paste(ic, ((w - s) // 2, (h - s) // 2)); im.save(p); n += 1
              print('Pantallas de inicio reemplazadas:', n)
              if n == 0: warn('no se encontró la imagen de inicio (se verá la de Capacitor)')
          except Exception as e:
              warn('splash: %s' % e)

          # 7) Nombre visible
          try:
              sp = os.path.join(RES, 'values', 'strings.xml')
              s = read(sp)
              s = re.sub(r'(<string name="app_name">)[^<]*(</string>)', r'\g<1>Celestia\g<2>', s)
              s = re.sub(r'(<string name="title_activity_main">)[^<]*(</string>)', r'\g<1>Celestia\g<2>', s)
              write(sp, s)
          except Exception as e:
              warn('nombre: %s' % e)
          print('Listo.', len(warns), 'avisos')
          EOF_PY

      - name: Personalizar el proyecto (permisos, iconos, versión)
        run: |
          python3 -m pip install --quiet pillow
          python3 cap/extra/customize.py cap

      - name: Sincronizar
        working-directory: cap
        run: npx cap sync android

      - name: Compilar
        working-directory: cap/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Firmar el APK
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          UNSIGNED=$(ls cap/android/app/build/outputs/apk/release/*.apk | head -1)
          echo "Archivo sin firmar: $UNSIGNED"
          echo "$KS_B64" | base64 -d > cap/celestia.keystore
          "$BT/zipalign" -p -f 4 "$UNSIGNED" cap/aligned.apk
          "$BT/apksigner" sign --ks cap/celestia.keystore --ks-pass pass:celestia-android --key-pass pass:celestia-android --ks-key-alias celestia --out cap/Celestia.apk cap/aligned.apk
          "$BT/apksigner" verify --print-certs cap/Celestia.apk | head -3
          rm -f cap/celestia.keystore
          ls -la cap/Celestia.apk

      - name: Guardar copia del APK en Actions
        uses: actions/upload-artifact@v4
        with:
          name: Celestia-APK
          path: cap/Celestia.apk
          retention-days: 30

      - name: Publicar el enlace de descarga
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest cap/Celestia.apk \
            --title "Celestia para Android" \
            --notes "APK listo para instalar. Versión 1.0.${RUN_NUMBER}." \
            --latest=false
          echo "Descarga: https://github.com/${{ github.repository }}/releases/download/android-latest/Celestia.apk"
